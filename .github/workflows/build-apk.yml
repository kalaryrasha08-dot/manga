name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

concurrency:
group: android-apk-${{ github.ref }}
cancel-in-progress: true

jobs:
build-apk:
name: Build Android Debug APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Validate Project
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f package.json ]; then
        echo "::error::package.json not found in repository root."
        exit 1
      fi

      echo "Project files:"
      ls -la

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      cache: npm
      cache-dependency-path: package-lock.json

  - name: Setup Java JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Dependencies
    shell: bash
    run: |
      set -euo pipefail
      npm install --legacy-peer-deps --no-audit --no-fund

  - name: Build Vite Web App
    shell: bash
    run: |
      set -euo pipefail
      npm run build

      if [ ! -d dist ]; then
        echo "::error::Build completed but the dist directory was not found."
        exit 1
      fi

  - name: Setup Capacitor Android
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f capacitor.config.ts ] && \
         [ ! -f capacitor.config.json ] && \
         [ ! -f capacitor.config.js ]; then
        echo "::error::Capacitor config not found. Configure Capacitor before building."
        exit 1
      fi

      npm ls @capacitor/core @capacitor/cli @capacitor/android

      if [ ! -d android ]; then
        npx cap add android
      fi

      npx cap sync android

  - name: Validate Android Project
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f android/gradlew ]; then
        echo "::error::android/gradlew not found."
        exit 1
      fi

      if [ ! -f android/settings.gradle ] && \
         [ ! -f android/settings.gradle.kts ]; then
        echo "::error::Android Gradle settings file not found."
        exit 1
      fi

      chmod +x android/gradlew

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Debug APK
    working-directory: android
    shell: bash
    run: |
      set -euo pipefail
      ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Verify APK
    shell: bash
    run: |
      set -euo pipefail

      APK="android/app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -s "$APK" ]; then
        echo "::error::APK was not generated or is empty."
        find android -type f -name "*.apk" -print
        exit 1
      fi

      ls -lh "$APK"
      sha256sum "$APK"

  - name: Upload Android APK
    uses: actions/upload-artifact@v4
    with:
      name: kak-manga-android-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
